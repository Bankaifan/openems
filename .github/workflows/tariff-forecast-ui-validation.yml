name: Tariff forecast UI validation
on:
  push:
    branches:
      - feature/ui-dynamic-tariff-price-forecast
  workflow_dispatch:

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Validate translations
        run: npm run lint:i18n
      - name: Run tariff forecast unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --include='src/app/edge/live/common/tariff-price-chart/forecast-utils.spec.ts'
      - name: Compile Edge UI
        run: npx ng build --configuration=openems,openems-edge-prod,prod
