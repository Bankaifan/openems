name: Octopus review-fixes CI (fork only)

on:
  push:
    branches:
      - ci/octopus-review-fixes
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: ./gradlew :io.openems.edge.timeofusetariff.octopus:compileJava :io.openems.edge.timeofusetariff.octopus:compileTestJava --console=plain
      - name: Unit tests
        run: ./gradlew :io.openems.edge.timeofusetariff.octopus:test --console=plain
      - name: Checkstyle
        run: ./gradlew :io.openems.edge.timeofusetariff.octopus:checkstyleMain :io.openems.edge.timeofusetariff.octopus:checkstyleTest --console=plain
      - name: Resolve EdgeApp bndrun
        run: ./gradlew :io.openems.edge.application:resolve.EdgeApp --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octopus-reports
          path: |
            io.openems.edge.timeofusetariff.octopus/generated/test-reports/
            io.openems.edge.timeofusetariff.octopus/build/reports/
          if-no-files-found: ignore
